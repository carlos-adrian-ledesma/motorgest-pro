
name: MotorGest Pro Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-tests:
    name: Python ${{ matrix.python-version }} / Node 22
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-portfolio.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portfolio dependencies
        run: python -m pip install -r requirements-portfolio.txt

      - name: Validate Python syntax
        run: python -m compileall -q src tests

      - name: Validate JavaScript syntax
        run: node --check web/assets/integrity.js

      - name: Run portfolio regression tests
        run: python -m pytest -q tests
